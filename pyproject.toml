[project]
name = "relational-attention"
version = "0.1.0"
description = "Minimal attention mechanisms for relational tasks: XOR and ordinal relations"
readme = "README.md"
authors = [
    { name = "Keith T. Murray", email = "murraykeith64@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
